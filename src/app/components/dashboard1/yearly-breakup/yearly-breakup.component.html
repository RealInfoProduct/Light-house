<mat-card class="cardWithShadow">
  <mat-card-header>
    <mat-card-title>Yearly Breakup</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <div class="row m-t-24">
      <div class="col-7">
        <h4 class="mat-headline-5">₹{{ (totalIncome || 0) | number:'1.0-0' }}</h4>
        <div class="d-flex align-items-center m-t-16">
          <button mat-mini-fab
            [ngClass]="percentageChange >= 0 ? 'bg-light-success text-success' : 'bg-light-error text-error'"
            class="shadow-none icon-27">
            <i-tabler [name]="percentageChange >= 0 ? 'arrow-up-right' : 'arrow-down-right'" class="icon-20"></i-tabler>
          </button>

          <div class="mat-body-1 f-w-600 m-l-12" [ngClass]="percentageChange >= 0 ? 'text-success' : 'text-danger'">
            {{ percentageChange >= 0 ? '+' : '' }}
            {{ percentageChange | number:'1.0-0' }}%
          </div>

          <div class="mat-body-1 m-l-4">last year</div>
        </div>

        <div class="d-flex align-items-center m-t-32">
          <div class="d-flex align-items-center clickable" [ngClass]="{'active-year': selectedYear === currentYear}"
            (click)="onYearClick(currentYear)">
            <i-tabler name="circle-filled"
              [ngClass]="{'text-primary': selectedYear === currentYear, 'text-light-primary': selectedYear !== currentYear}"
              class="icon-12 d-flex"></i-tabler>
            <div class="mat-body-1 m-l-12">{{ currentYear }}</div>
          </div>

          <div class="d-flex align-items-center m-l-16 clickable"
            [ngClass]="{'active-year': selectedYear === previousYear}" (click)="onYearClick(previousYear)">
            <i-tabler name="circle-filled"
              [ngClass]="{'text-primary': selectedYear === previousYear, 'text-light-primary': selectedYear !== previousYear}"
              class="icon-12 d-flex"></i-tabler>
            <div class="mat-body-1 m-l-12">{{ previousYear }}</div>
          </div>
        </div>

      </div>
      <div class="col-5 d-flex align-items-start">
        <apx-chart #chart [series]="yearlyChart.series" [chart]="yearlyChart.chart" [colors]="yearlyChart.colors"
          [plotOptions]="yearlyChart.plotOptions" [dataLabels]="yearlyChart.dataLabels" [legend]="yearlyChart.legend"
          [tooltip]="yearlyChart.tooltip"></apx-chart>

      </div>
    </div>
  </mat-card-content>
</mat-card>
