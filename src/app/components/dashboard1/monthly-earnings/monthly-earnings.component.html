<mat-card class="cardWithShadow">
  <mat-card-header class="d-flex align-items-center">
    <mat-card-title>Monthly Earnings</mat-card-title>
    <div class="m-l-auto">
      <button mat-fab color="accent" class="shadow-none icon-48">
        <i-tabler name="currency-dollar" class="text-white d-flex"></i-tabler>
      </button>
    </div>
  </mat-card-header>
  <mat-card-content class="m-b-32">
  <h4 class="mat-headline-5">₹{{ (currentMonthIncome || 0) | number:'1.0-0' }}</h4>
    <div class="d-flex align-items-center m-t-16">
      <button mat-mini-fab [ngClass]="percentageChange >= 0 ? 'bg-light-success text-success' : 'bg-light-error text-error'"
        class="shadow-none icon-27">
        <i-tabler [name]="percentageChange >= 0 ? 'arrow-up-right' : 'arrow-down-right'" class="icon-20"></i-tabler>
      </button>

    <div class="mat-body-1 f-w-600 m-l-12"
       [ngClass]="percentageChange >= 0 ? 'text-success' : 'text-danger'">
    {{ percentageChange >= 0 ? '+' : '' }}
    {{ percentageChange | number:'1.0-0' }}%
  </div>


      <div class="mat-body-1 m-l-4">last Month</div>
    </div>
  </mat-card-content>
</mat-card>
