name: Deploy to Firebase Hosting (dev)

on:
  push:
    branches:
      - dev  # or your development branch name

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'  # or your Node version

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Angular (dev)
        run: npx ng build --configuration=development

      - name: Deploy to Firebase (dev)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIGHTHOUSEDEV }}'
          projectId: lighthousedev-64439
          channelId: live  # or 'dev' if you want a different channel
