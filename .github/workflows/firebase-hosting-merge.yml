name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - dev          # Deploy dev on any push
  pull_request:
    branches:
      - main         # Optional: preview PRs targeting main
  push:
    branches:
      - main         # Deploy prod on merge to main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      # Checkout the repo
      - uses: actions/checkout@v2

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # Install dependencies with legacy peer deps
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # Build Angular project based on branch
      - name: Build Angular
        run: |
          echo "Current branch: ${GITHUB_REF##*/}"
          if [ "${GITHUB_REF##*/}" == "dev" ]; then
            echo "Building DEV version..."
            npm run build:dev
          elif [ "${GITHUB_REF##*/}" == "main" ]; then
            echo "Building PROD version..."
            npm run build:prod
          else
            echo "Branch not configured for deployment, exiting..."
            exit 0
          fi

      # Deploy to Firebase based on branch
      - name: Deploy to Firebase
        if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          rebaseServiceAccount: ${{ github.ref == 'refs/heads/main' && secrets.FIREBASE_SERVICE_ACCOUNT_LIGHTHOUSEPROD_D5F45 || secrets.FIREBASE_SERVICE_ACCOUNT_LIGHTHOUSEDEV }}
          channelId: live
          projectId: ${{ github.ref == 'refs/heads/main' && 'lighthouseprod-d5f45' || 'lighthousedev-64439' }}
