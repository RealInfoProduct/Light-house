name: Deploy to Firebase Hosting

# Trigger on push to dev or main, and on PR merge to main
on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # 4️⃣ Build Angular
      - name: Build Angular
        run: |
          if [ "${GITHUB_REF##*/}" == "main" ]; then
            echo "Building PROD version..."
            npm run build:prod
          else
            echo "Building DEV version..."
            npm run build:dev
          fi

      # 5️⃣ Deploy to Firebase
      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ github.ref == 'refs/heads/main' && secrets.FIREBASE_SERVICE_ACCOUNT_LIGHTHOUSEPROD_D5F45 || secrets.FIREBASE_SERVICE_ACCOUNT_LIGHTHOUSEDEV }}
          projectId: ${{ github.ref == 'refs/heads/main' && 'lighthouseprod-d5f45' || 'lighthousedev-64439' }}
          target: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
