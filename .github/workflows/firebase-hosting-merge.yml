name: Deploy to Firebase Hosting (Dev & Prod)

on:
  push:
    branches:
      - main
      - dev

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repo
      - uses: actions/checkout@v2

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # Install dependencies with legacy peer deps
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # Build Angular project based on branch
      - name: Build Angular
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            npm run build:prod
          else
            npm run build:dev
          fi

      # Deploy to Firebase based on branch
      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: "${{ github.ref == 'refs/heads/main' && secrets.FIREBASE_SERVICE_ACCOUNT_LIGHTHOUSEPROD_D5F45 || secrets.FIREBASE_SERVICE_ACCOUNT_LIGHTHOUSEDEV_64439 }}"
          channelId: live
          projectId: "${{ github.ref == 'refs/heads/main' && 'lighthouseprod-d5f45' || 'lighthousedev-64439' }}"
          target: "${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}"
