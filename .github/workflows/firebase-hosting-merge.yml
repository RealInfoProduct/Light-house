name: Deploy to Firebase Hosting

# Triggers:
# - push to dev -> deploy DEV
# - pull request merged to main -> deploy PROD
on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      # Checkout the repo
      - uses: actions/checkout@v2

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # Install dependencies with legacy peer deps
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # Determine build type and Firebase project
      - name: Set environment variables
        id: set_env
        run: |
          if [ "${GITHUB_REF##*/}" == "dev" ]; then
            echo "BUILD_SCRIPT=build:dev" >> $GITHUB_ENV
            echo "FIREBASE_PROJECT_ID=lighthousedev-64439" >> $GITHUB_ENV
            echo "FIREBASE_SERVICE_ACCOUNT_SECRET=FIREBASE_SERVICE_ACCOUNT_LIGHTHOUSEDEV" >> $GITHUB_ENV
          else
            # For PR merge to main
            echo "BUILD_SCRIPT=build:prod" >> $GITHUB_ENV
            echo "FIREBASE_PROJECT_ID=lighthouseprod-d5f45" >> $GITHUB_ENV
            echo "FIREBASE_SERVICE_ACCOUNT_SECRET=FIREBASE_SERVICE_ACCOUNT_LIGHTHOUSEPROD_D5F45" >> $GITHUB_ENV
          fi

      # Build Angular project
      - name: Build Angular
        run: npm run $BUILD_SCRIPT

      # Deploy to Firebase Hosting
      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets[env.FIREBASE_SERVICE_ACCOUNT_SECRET] }}
          channelId: live
          projectId: ${{ env.FIREBASE_PROJECT_ID }}
